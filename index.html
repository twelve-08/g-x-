<script>
/* Integral language: tokenizer, expression parser, statement parser.
   Pure functions, no DOM. Exposes GX.Lang.compile(src) */
(function (root) {
'use strict';
const GX = root.GX = root.GX || {};

const OPEN = { '(': ')', '<': '>', '[': ']' };
const FN = new Set(['sin','cos','tan','asin','acos','atan','sqrt','abs','floor','ceil','ceiling','round','ln','log','exp','sign','min','max']);

function fail(msg) { const e = new Error(msg); throw e; }

function matchClose(s, i) {
  const stack = [];
  for (let j = i; j < s.length; j++) {
    const c = s[j];
    if (c === '(' || c === '<' || c === '[') stack.push(OPEN[c]);
    else if (c === ')' || c === '>' || c === ']') {
      if (c === stack[stack.length - 1]) { stack.pop(); if (!stack.length) return j; }
    }
  }
  return -1;
}

function splitTop(s, ch) {
  const out = []; let depth = 0, cur = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '(' || c === '[' || c === '<') depth++;
    else if (c === ')' || c === ']' || c === '>') depth--;
    if (c === ch && depth === 0) { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur);
  return out;
}

const isLetter = (c) => !!c && /[A-Za-z_]/.test(c);

function tokenize(s) {
  const out = []; const n = s.length; let i = 0;
  while (i < n) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '(' || c === '<' || c === '[') {
      const j = matchClose(s, i);
      if (j < 0) fail('Missing closing bracket for ' + c);
      out.push({ k: c === '(' ? 'G' : c === '<' ? 'B' : 'L', v: s.slice(i + 1, j) });
      i = j + 1;
      if (s[i] === ',' && c === '[') i++;
      continue;
    }
    if (c === '/' && s.substr(i + 1, 6) === 'vector') {
      let depth = 0, j = i + 1;
      for (; j < n; j++) {
        if (s[j] === '(' || s[j] === '[' || s[j] === '<') depth++;
        else if (s[j] === ')' || s[j] === ']' || s[j] === '>') depth--;
        else if (s[j] === '/' && depth === 0) break;
      }
      if (j >= n) fail('Vector is missing its closing /');
      out.push({ k: 'V', v: s.slice(i + 1, j) });
      i = j + 1; continue;
    }
    if ('+*^%/-'.includes(c)) { out.push({ k: 'O', v: c }); i++; continue; }
    let j = i;
    while (j < n) {
      const d = s[j];
      if (/\s/.test(d) || '()<>[]'.includes(d) || '+*^%/'.includes(d)) break;
      if (d === '-' && j > i && (!isLetter(s[j - 1]) || !isLetter(s[j + 1])) && j + 1 < n) break;
      j++;
    }
    if (j === i) { i++; continue; }
    out.push({ k: 'W', v: s.slice(i, j) });
    i = j;
  }
  return out;
}

// ---------- templates ----------
const T = (str, name) => ({ tpl: str.toLowerCase().split(' '), name });
const REPORTERS = [
  T('distance from $ to $', 'distance'), T('random $ to $', 'random'),
  T('round $ to place $', 'roundp'), T('simplify $', 'simplify'),
  T('evaluate $ for $ = $', 'evalfor'), T('lerp $ to $ by $', 'lerp'),
  T('clamp $ between $ and $', 'clamp'),
  T('join $', 'join'), T('length $', 'length'), T('length of $', 'length'),
  T('index of $ in $', 'indexof'), T('letters from $ to $ in $', 'letters'),
  T('replace all $ in $ with $', 'replaceall'), T('count of $ in $', 'countof'),
  T('uppercase of $', 'upper'), T('lowercase of $', 'lower'),
  T('last key pressed', 'lastkey'), T('cursor x', 'cursorx'), T('cursor y', 'cursory'),
  T('normal direction between me and $', 'normdir'),
  T('received data', 'received'), T('texture index', 'texindex'),
  T('x velocity', 'xvel'), T('y velocity', 'yvel'), T('angular velocity', 'angvel'),
  T('get $ of construct $', 'getof'), T('get $ of object $', 'getof'),
  T('ms of timer $', 'timer_ms'), T('secs of timer $', 'timer_s'),
  T('mins of timer $', 'timer_m'), T('hrs of timer $', 'timer_h'),
  T('volume of sound $', 'soundvol'),
  T('item $ in $', 'item'), T('average of list $', 'average'), T('sum of list $', 'sum'),
  T('reverse list $', 'reverse'), T('length of list $', 'length'),
  T('angle of $', 'vangle'), T('magnitude of $', 'vmag'), T('x of $', 'vx'), T('y of $', 'vy'),
  T('sqrt of $', 'sqrt'), T('abs of $', 'abs'), T('floor of $', 'floor'), T('ceiling of $', 'ceil')
];
const BOOLEANS = [
  T('$ and $', 'and'), T('$ or $', 'or'), T('not $', 'not'),
  T('$ = $', 'eq'), T('$ != $', 'neq'),
  T('$ greater than $', 'gt'), T('$ less than $', 'lt'),
  T('$ has $', 'has'),
  T('key $ pressed', 'keydown'), T('key $ down', 'keydown'), T('key $ hit', 'keyhit'),
  T('touching object $', 'touching'), T('touching $', 'touching'),
  T('mouse down', 'mousedown')
];
const STATEMENTS = [
  T('wait $ secs', 'wait'), T('wait until $', 'waituntil'), T('wait $ secs or until $', 'waitor'),
  T('create timer $', 'timer_create'), T('delete timer $', 'timer_delete'),
  T('delete all timers', 'timer_deleteall'), T('start timer $', 'timer_start'),
  T('end timer $', 'timer_end'), T('set timer $ to $ secs', 'timer_set'),
  T('broadcast message $ with data $', 'broadcast'), T('broadcast message $', 'broadcast'),
  T('play sound $', 'sound_play'), T('stop sound $', 'sound_stop'), T('stop all sounds', 'sound_stopall'),
  T('set volume of sound $ to $', 'sound_vol'),
  T('set texture to $', 'tex_set'), T('cycle next texture', 'tex_next'),
  T('cycle previous texture', 'tex_prev'), T('disappear', 'hide'), T('show', 'show'),
  T('stretch texture to x: $ y: $', 'tex_stretch'),
  T('construct new $ with radius $ at $ with ID $', 'construct'),
  T('construct new $ with dimensions $ at $ with ID $', 'construct'),
  T('construct new $ with radius $ at $', 'construct'),
  T('construct new $ with dimensions $ at $', 'construct'),
  T('construct new $ at $', 'construct'),
  T('duplicate this object', 'dup_self'), T('duplicate object $', 'dup_obj'),
  T('destroy construct $', 'destroy'), T('destroy all constructs', 'destroy_all'),
  T('destroy me', 'destroy_me'),
  T('new list $ ID $', 'list_new'), T('add $ to list $', 'list_add'),
  T('delete item $ of list $', 'list_delete'), T('clear list $', 'list_clear'),
  T('replace item $ of list $ with $', 'list_replace'),
  T('brush down', 'brush_down'), T('brush up', 'brush_up'), T('wash canvas', 'wash'),
  T('paint myself at $', 'paint_me'), T('paint line to $', 'paint_line'),
  T('set paint color to $', 'paint_color'), T('set brush size to $', 'brush_size'),
  T('set paint transparency to $', 'paint_alpha'),
  T('point $ degrees', 'point'), T('point towards $', 'point_towards'),
  T('turn $ degrees', 'turn'), T('move $ steps', 'move'),
  T('tick physics', 'phys_tick'), T('enable physics for $', 'phys_on'), T('disable physics for $', 'phys_off'),
  T('set mode to polygonal', 'phys_poly'), T('set mode to circular', 'phys_circ'),
  T('set density to $', 'phys_density'), T('set gravity to $', 'phys_gravity'),
  T('set velocity to $', 'phys_vel'), T('set rotation velocity to $', 'phys_rotvel'),
  T('set wind velocity to $', 'phys_wind'), T('push with force $ at angle $', 'phys_push'),
  T('stop all', 'stop_all'), T('stop this script', 'stop_this')
];

function matchTpl(tpl, toks) {
  if (tpl.length !== toks.length) return null;
  const args = [];
  for (let i = 0; i < tpl.length; i++) {
    const t = toks[i];
    if (tpl[i] === '$') { if (t.k === 'O') return null; args.push(t); }
    else if (t.k !== 'W' || t.v.toLowerCase() !== tpl[i]) return null;
  }
  return args;
}

// ---------- parse state ----------
let CUR = { funcs: [] };

function wordNode(v) {
  if (/^-?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(v)) return { t: 'num', v: parseFloat(v) };
  const lv = v.toLowerCase();
  if (lv === 'true') return { t: 'bool', v: true };
  if (lv === 'false') return { t: 'bool', v: false };
  if (lv.startsWith('att.')) return { t: 'att', name: v.slice(4) };
  if (lv.startsWith('data.')) return { t: 'data', name: v.slice(5) };
  const f = CUR.funcs.find(f => f.tpl.length === 1 && f.tpl[0] === lv);
  if (f) return { t: 'rep', name: 'call', fn: f, a: [] };
  const n = { t: 'word', v };
  if (lv === 'direction' || lv === 'constructid') n.builtin = lv;
  return n;
}

function fromToken(t) {
  switch (t.k) {
    case 'G': return parseGroup(t.v);
    case 'B': return parseBool(t.v);
    case 'V': return parseVec(t.v);
    case 'L': return { t: 'list', items: splitTop(t.v, ',').map(x => x.trim()).filter(x => x !== '').map(parseValue) };
    case 'W': return wordNode(t.v);
  }
  fail('Unexpected "' + t.v + '"');
}

function stripBr(s) {
  let out = '', depth = 0;
  for (const c of s) {
    if (c === '(' || c === '[' || c === '<') { if (!depth) out += '_'; depth++; }
    else if (c === ')' || c === ']' || c === '>') depth--;
    else if (!depth) out += c;
  }
  return out;
}
function looksTuple(parts) {
  if (parts.some(p => !p.trim())) return false;
  for (let i = 0; i < parts.length; i++) {
    const sp = stripBr(parts[i]);
    if (!/^[\w.\s+\-*\/^%]*$/.test(sp)) return false;
    if (/[A-Za-z_]\s+[A-Za-z_]/.test(sp)) return false;
    if (i > 0 && /^\s+[A-Za-z]/.test(parts[i])) return false;
  }
  return true;
}

function parseGroup(inner) {
  const s = inner.trim();
  if (!s) return { t: 'str', v: '' };
  const parts = splitTop(inner, ',');
  if (parts.length >= 2 && parts.length <= 3 && looksTuple(parts)) {
    return { t: 'tuple', items: parts.map(p => parseValue(p)) };
  }
  return parseSeq(tokenize(s), s);
}

function parseValue(s) {
  s = s.trim();
  if (!s) return { t: 'str', v: '' };
  const toks = tokenize(s);
  if (toks.length === 1) return fromToken(toks[0]);
  return parseSeq(toks, s);
}

function matchReporter(toks) {
  for (const f of CUR.funcs) {
    const a = matchTpl(f.tpl, toks);
    if (a) return { t: 'rep', name: 'call', fn: f, a: a.map(fromToken), raw: a };
  }
  for (const r of REPORTERS) {
    const a = matchTpl(r.tpl, toks);
    if (!a) continue;
    if (r.name === 'join') {
      const inner = a[0].k === 'G' ? tokenize(a[0].v) : [a[0]];
      return { t: 'rep', name: 'join', a: inner.map(fromToken) };
    }
    return { t: 'rep', name: r.name, a: a.map(fromToken) };
  }
  // "att.x of (Name)"
  if (toks.length === 3 && toks[0].k === 'W' && /^(att|data)\./i.test(toks[0].v) &&
      toks[1].k === 'W' && toks[1].v.toLowerCase() === 'of') {
    return { t: 'rep', name: 'getof', a: [fromToken(toks[0]), fromToken(toks[2])] };
  }
  return null;
}

function parseSeq(toks, src) {
  if (toks.length === 0) return { t: 'str', v: '' };
  if (toks.length === 1 && toks[0].k !== 'O') return fromToken(toks[0]);
  const r = matchReporter(toks);
  if (r) return r;
  try { const node = parseInfix(toks); if (node) return node; } catch (e) { if (e.fatal) throw e; }
  return { t: 'str', v: src };
}

function parseInfix(toks) {
  let p = 0;
  const peek = () => toks[p];
  const isOp = (t, ...ops) => t && ((t.k === 'O' && ops.includes(t.v)) || (t.k === 'W' && ops.includes(t.v.toLowerCase())));
  function primary() {
    const t = toks[p];
    if (!t) fail('Expression ended early');
    if (t.k === 'O') {
      if (t.v === '-') { p++; return { t: 'neg', a: pow() }; }
      fail('Unexpected ' + t.v);
    }
    if (t.k === 'W') {
      const lw = t.v.toLowerCase();
      if (FN.has(lw) && toks[p + 1] && toks[p + 1].k === 'G') {
        p += 2;
        const args = splitTop(toks[p - 1].v, ',').map(x => parseValue(x));
        return { t: 'call', fn: lw, args };
      }
    }
    p++;
    return fromToken(t);
  }
  function pow() {
    const a = primary();
    if (isOp(peek(), '^')) { p++; return { t: 'bin', op: '^', a, b: pow() }; }
    return a;
  }
  function mul() {
    let a = pow();
    while (isOp(peek(), '*', '/', '%', 'mod')) {
      const op = toks[p++].v.toLowerCase(); a = { t: 'bin', op: op === 'mod' ? '%' : op, a, b: pow() };
    }
    return a;
  }
  function add() {
    let a = mul();
    while (isOp(peek(), '+', '-')) { const op = toks[p++].v; a = { t: 'bin', op, a, b: mul() }; }
    return a;
  }
  const node = add();
  if (p < toks.length) fail('Unexpected "' + toks[p].v + '"');
  return node;
}

function parseBool(inner) {
  const s = inner.trim().replace(/\?\s*$/, '').trim();
  if (!s) return { t: 'bool', v: false };
  const toks = tokenize(s);
  if (toks.length === 1) return fromToken(toks[0]);
  for (const b of BOOLEANS) {
    const a = matchTpl(b.tpl, toks);
    if (a) return { t: 'rep', name: b.name, a: a.map(fromToken) };
  }
  return parseSeq(toks, s);
}

function parseVec(v) {
  const toks = tokenize(v.slice(6));
  if (toks[0] && toks[0].k === 'W' && toks[0].v.toLowerCase() === 'magnitude' &&
      toks[2] && toks[2].k === 'W' && toks[2].v.toLowerCase() === 'angle' && toks.length === 4) {
    return { t: 'rep', name: 'vecma', a: [fromToken(toks[1]), fromToken(toks[3])] };
  }
  if (toks.length === 1) return { t: 'rep', name: 'vecxy', a: [fromToken(toks[0])] };
  fail('Vector needs (x,y) or magnitude () angle ()');
}

// ---------- statements ----------
function cleanLine(raw) {
  let s = raw.replace(/(^|\s)\/\/.*$/, '').replace(/(^|\s)#.*$/, '').trim();
  if (!s) return '';
  s = s.replace(/[“”]/g, '"').replace(/"$/, '');
  if (s.endsWith(':') && !/\bx:\s*$/.test(s)) s = s.slice(0, -1).trim();
  // repair unbalanced parens at the end of a line
  let open = 0;
  for (const c of s) { if (c === '(') open++; else if (c === ')') open--; }
  while (open-- > 0) s += ')';
  return s;
}

const HAT_RE = /^on\s+/i;
function parseHat(s) {
  let m;
  if (/^on\s+start$/i.test(s)) return { type: 'start' };
  if (/^on\s+construct\s+start$/i.test(s)) return { type: 'construct' };
  if (/^on\s+clicked$/i.test(s)) return { type: 'clicked' };
  if ((m = /^on\s+message\s*(.*)$/i.exec(s))) return { type: 'message', arg: parseValue(m[1] || '()') };
  if ((m = /^on\s+key\s*(.*?)\s*(pressed)?$/i.exec(s))) return { type: 'key', arg: parseValue(m[1]) };
  fail('Unknown event "' + s + '"');
}

function findTopEquals(s) {
  let depth = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '(' || c === '[' || c === '<') depth++;
    else if (c === ')' || c === ']' || c === '>') depth--;
    else if (c === '=' && depth === 0 && !'<>!='.includes(s[i - 1] || ' ') && s[i + 1] !== '=') return i;
  }
  return -1;
}

const ASSIGN_LHS = /^(?:(edit|set|change)\s+)?(?:(global)\s+)?\(?([A-Za-z_][\w.\-]*)\)?(?:\s+of\s+(.+))?$/i;

function parseAssign(s) {
  const eq = findTopEquals(s);
  if (eq < 0) return null;
  const lhs = s.slice(0, eq).trim(), rhs = s.slice(eq + 1).trim();
  const m = ASSIGN_LHS.exec(lhs);
  if (!m) return null;
  const name = m[3];
  const ln = name.toLowerCase();
  if (['if', 'repeat', 'until', 'wait', 'switch', 'case'].includes(ln)) return null;
  const expr = parseValue(rhs);
  if (ln.startsWith('att.')) return { t: 'assign', kind: 'att', name: name.slice(4), of: m[4] ? parseValue(m[4]) : null, expr };
  if (ln.startsWith('data.')) return { t: 'assign', kind: 'data', name: name.slice(5), of: m[4] ? parseValue(m[4]) : null, expr };
  if (m[1] && m[1].toLowerCase() === 'edit') fail('"edit" needs an attribute such as att.x');
  return { t: 'assign', kind: 'var', name, global: !!m[2], expr };
}

function parseSig(text) {
  const toks = tokenize(text);
  const tpl = [], params = [];
  for (const t of toks) {
    if (t.k === 'G') { tpl.push('$'); params.push(t.v.trim()); }
    else if (t.k === 'W') tpl.push(t.v.toLowerCase());
    else fail('Bad function signature');
  }
  return { tpl, params, name: tpl.join(' ') };
}

function yieldsIn(stmts) {
  for (const s of stmts) {
    if (s.t === 'cmd' && /^wait/.test(s.name)) return true;
    if (s.t === 'forever' || s.t === 'until') return true;
    for (const k of ['body', 'else']) if (s[k] && yieldsIn(s[k])) return true;
    if (s.cases && s.cases.some(c => yieldsIn(c.body))) return true;
    if (s.def && yieldsIn(s.def)) return true;
  }
  return false;
}

function compile(src) {
  const lines = String(src).split(/\r?\n/).map((raw, i) => ({ n: i + 1, s: cleanLine(raw) })).filter(l => l.s);
  const errors = [];
  const err = (n, msg) => errors.push({ line: n, msg });
  const funcs = [];

  // pass 1: function signatures
  for (const L of lines) {
    const m = /^define\s*\[(.*)\]$/i.exec(L.s);
    if (m) { try { const f = parseSig(m[1]); f.body = []; funcs.push(f); L.fn = f; } catch (e) { err(L.n, e.message); } }
  }
  let i = 0;
  const lowOf = () => lines[i].s.toLowerCase();
  const isHatLine = (low) => HAT_RE.test(low) || /^define\s*\[/.test(low);
  const isEnd = (low) => low === 'end';

  function safe(L, fn, fallback) {
    try { return fn(); } catch (e) { err(L.n, e.message); return fallback; }
  }

  function parseBlock(stop) {
    const out = [];
    while (i < lines.length) {
      const low = lowOf();
      if (stop(low) || isHatLine(low)) break;
      out.push(parseStmt());
    }
    return out;
  }
  function expectEnd(L, what) {
    if (i < lines.length && isEnd(lowOf())) { i++; return; }
    err(L.n, 'Missing "end" for ' + what);
  }
  const stopEnd = (low) => isEnd(low);

  function parseStmt() {
    const L = lines[i++]; const s = L.s; const low = s.toLowerCase();
    let m;
    const node = (o) => { o.line = L.n; return o; };
    if (isEnd(low)) { err(L.n, 'Unexpected "end"'); return node({ t: 'nop' }); }
    if ((m = /^repeat\s+until\s+(.*)$/i.exec(s))) {
      const cond = safe(L, () => parseValue(m[1]), { t: 'bool', v: false });
      const body = parseBlock(stopEnd); expectEnd(L, 'repeat until');
      return node({ t: 'until', cond, body });
    }
    if ((m = /^repeat\s*(.*)$/i.exec(s)) && !/^repeat\s+until/i.test(s)) {
      const count = safe(L, () => parseValue(m[1] || '(1)'), { t: 'num', v: 1 });
      const body = parseBlock(stopEnd); expectEnd(L, 'repeat');
      return node({ t: 'repeat', count, body, yields: yieldsIn(body) });
    }
    if ((m = /^(?:indefinitely|forever)$/i.exec(s))) {
      const body = parseBlock(stopEnd); expectEnd(L, 'indefinitely');
      return node({ t: 'forever', body });
